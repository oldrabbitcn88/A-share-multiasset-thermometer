# 固收+ 多资产温度计配置
# 温度定义：0–100，越高 = 越贵 / 越拥挤 / 未来预期回报越低

[wind]
# 万得 EDB 指标代码（已实测有权限的为中国货币网 / 人民银行口径；中债口径需另行开通权限）
y10      = "M0048271"   # 中国:国债到期收益率:10年（中国货币网）——已验证
omo7d    = "M0041371"   # 中国:逆回购利率:7天（人民银行）——已验证
mtn_aaa3 = "M1002841"   # 中国:中短票据到期收益率(AAA):3年（中证指数公司）——已验证
mtn_aap3 = "M1002877"   # 中国:中短票据到期收益率(AA+):3年（中证指数公司）——已验证
cdb3     = "M1005175"   # 中国:政策性金融债(国开行)到期收益率(AAA):3年（中国货币网）——已验证
gov3     = ""           # 国债 3年（仅当 cdb3 为空时作为信用利差基准；中债口径无权限）

# 指数代码
equity_index   = "881001.WI"   # ERP 用：万得全A（可改 8841388.WI 万得全A除金融石油石化，代码请以终端为准）
dividend_index = "000300.SH"   # 股债利差用：沪深300 股息率
fund_index     = "885003.WI"   # 偏债混合型基金指数

[model]
smooth_days   = 20     # 原始值先做 N 日均值平滑
window_years  = 5      # 滚动分位窗口（年）。当前账号单次 EDB 历史约 5 年
min_obs       = 250    # 窗口内最少观测数，不足则该因子不出温度
fund_lookback_years = 3

[weights]
# 资产温度权重
stock_erp  = 0.5
stock_dy   = 0.5
rate_level = 0.5       # 10Y 绝对水平
rate_spread_omo = 0.5  # 10Y − 7天逆回购（剔除政策利率趋势）
bond_rate   = 0.6
bond_credit = 0.4
credit_spread = 0.7
credit_grade  = 0.3
cb_premium = 0.7
cb_stock   = 0.3
# 综合温度权重
comp_stock = 0.30
comp_bond  = 0.35
comp_cb    = 0.15
comp_mr    = 0.20
